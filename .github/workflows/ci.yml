name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: pnpm quality

  native-quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable && corepack install
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - run: pnpm quality:native
        env:
          CALORIE_DERIVED_DATA: ${{ runner.temp }}/calorie-native-derived
      - name: Preserve native failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-test-failure
          path: ${{ runner.temp }}/calorie-native-derived/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 1
