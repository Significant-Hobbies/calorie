name: Calorie
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 8F7LXHTJZR
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CalorieCore:
    type: framework
    platform: iOS
    sources: Sources/CalorieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  Calorie:
    type: application
    platform: iOS
    sources:
      - path: Sources/Calorie
      - path: Sources/Calorie/Resources
        buildPhase: resources
    dependencies:
      - target: CalorieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie
        PRODUCT_NAME: Calorie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calorie
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MACCATALYST: NO
  CalorieCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/CalorieCoreTests
    dependencies:
      - target: CalorieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie.core-tests
        GENERATE_INFOPLIST_FILE: YES
  CalorieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/CalorieUITests
    dependencies:
      - target: Calorie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Calorie:
    build:
      targets:
        Calorie: all
        CalorieCoreTests: [test]
        CalorieUITests: [test]
    test:
      targets:
        - CalorieCoreTests
        - CalorieUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
