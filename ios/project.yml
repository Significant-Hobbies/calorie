name: Calorie
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 8F7LXHTJZR
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PersonalSyncKit:
    url: https://github.com/Significant-Hobbies/personal-platform.git
    revision: 55176cac008d3857ef815d9bc5c8e74b68e7c3f3
targets:
  CalorieCore:
    type: framework
    platform: iOS
    sources: Sources/CalorieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  Calorie:
    type: application
    platform: iOS
    info:
      path: Sources/Calorie/Info.plist
      properties:
        CFBundleDisplayName: Calorie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - calorie
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Sources/Calorie
      - path: Sources/Calorie/Resources
        buildPhase: resources
    dependencies:
      - target: CalorieCore
      - package: PersonalSyncKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie
        PRODUCT_NAME: Calorie
        CODE_SIGN_ENTITLEMENTS: Sources/Calorie/Calorie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  CalorieCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/CalorieCoreTests
    dependencies:
      - target: CalorieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie.core-tests
        GENERATE_INFOPLIST_FILE: YES
  CalorieTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/CalorieTests
    dependencies:
      - target: Calorie
      - package: PersonalSyncKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie.tests
        GENERATE_INFOPLIST_FILE: YES
  CalorieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/CalorieUITests
    dependencies:
      - target: Calorie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.calorie.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Calorie:
    build:
      targets:
        Calorie: all
        CalorieCoreTests: [test]
        CalorieUITests: [test]
    test:
      targets:
        - CalorieCoreTests
        - CalorieTests
        - CalorieUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
